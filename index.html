<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Apply dark mode before the page draws, so it doesn't flash light first.
            try {
                if (JSON.parse(localStorage.getItem('dark'))) document.documentElement.classList.add('dark');
            } catch (e) {}
        </script>
        <meta name="viewport" content="width=1024" />
        <title>Nerfed Demon List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/account.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/home.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>NDL</h2>
                <p>v2.0.5</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">Home</span>
                </router-link>
                <router-link class="nav__tab" to="/list">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <button
                        class="nav__icon nav__icon--theme"
                        @click.prevent="store.toggleDark()"
                        :aria-label="store.dark ? 'Switch to light mode' : 'Switch to dark mode'"
                        :title="store.dark ? 'Light mode' : 'Dark mode'"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a class="nav__icon" href="https://discord.gg/M2KkGySwPG" target="_blank" rel="noopener" title="Discord server">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <router-link
                        v-if="session.user && session.user.staff"
                        class="nav__tab nav__tab--small"
                        to="/review"
                    >
                        <span class="type-label-lg">Review</span>
                    </router-link>
                    <router-link
                        v-if="session.user"
                        class="nav__account type-label-md"
                        to="/account"
                        :title="'Logged in with Discord as ' + session.user.discordUsername"
                    >
                        <img
                            v-if="session.user.avatar"
                            class="nav__avatar"
                            :src="session.user.avatar"
                            alt=""
                            referrerpolicy="no-referrer"
                        />
                        {{ session.user.name || session.user.discordUsername }}
                    </router-link>
                    <button
                        v-else-if="session.loaded"
                        class="nav__account type-label-md"
                        @click.prevent="login()"
                    >
                        Log in
                    </button>
                    <router-link class="nav__cta type-label-lg" to="/submit"
                        >Submit Record</router-link
                    >
                </div>
            </nav>
        </header>
        <router-view v-slot="{ Component }">
            <transition name="page" mode="out-in">
                <component :is="Component" :class="{ dark: store.dark }"></component>
            </transition>
        </router-view>
    </body>
</html>
